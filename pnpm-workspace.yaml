packages:
  - "apps/api"
  - "apps/admin"
  - "packages/*"

allowBuilds:
  esbuild: true
  "@node-rs/argon2": true
  sharp: true
  unrs-resolver: false

# apps/mobile is a Flutter project and is intentionally excluded from the
# pnpm workspace graph.
#
# `allowBuilds` above replaces the older `onlyBuiltDependencies` list in
# pnpm 11. unrs-resolver is denied deliberately: it runs no install script we
# need, it only performs an eslint resolver binding check.
