packages:
  - "apps/api"
  - "apps/admin"
  - "packages/*"

allowBuilds:
  esbuild: true
  "@node-rs/argon2": true
  sharp: true
  unrs-resolver: false

minimumReleaseAgeExclude:
  - '@next/env@16.2.12'
  - '@next/eslint-plugin-next@16.2.12'
  - '@next/swc-darwin-arm64@16.2.12'
  - '@next/swc-darwin-x64@16.2.12'
  - '@next/swc-linux-arm64-gnu@16.2.12'
  - '@next/swc-linux-arm64-musl@16.2.12'
  - '@next/swc-linux-x64-gnu@16.2.12'
  - '@next/swc-linux-x64-musl@16.2.12'
  - '@next/swc-win32-arm64-msvc@16.2.12'
  - '@next/swc-win32-x64-msvc@16.2.12'
  - eslint-config-next@16.2.12
  - next@16.2.12

# apps/mobile is a Flutter project and is intentionally excluded from the
# pnpm workspace graph.
#
# `allowBuilds` above replaces the older `onlyBuiltDependencies` list in
# pnpm 11. unrs-resolver is denied deliberately: it runs no install script we
# need, it only performs an eslint resolver binding check.
